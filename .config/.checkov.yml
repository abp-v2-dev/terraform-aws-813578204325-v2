# Default Checkov configuration for aws-ia Terraform modules
# Modules can override by placing a custom .config/.checkov.yml in their repo

download-external-modules: false
evaluate-variables: true
directory:
  - ./
framework:
  - terraform
skip-check:
  - CKV2_GCP*    # Skip non-AWS: Google Cloud checks
  - CKV_GCP*     # Skip non-AWS: Google Cloud checks
  - CKV_AZURE*   # Skip non-AWS: Azure checks
  - CKV2_AZURE*  # Skip non-AWS: Azure checks
  - CKV_ALI*     # Skip non-AWS: Alibaba Cloud checks
  - CKV_OCI*     # Skip non-AWS: Oracle Cloud checks
  - CKV_TF_1     # Default to Terraform registry instead of Git
  - CKV_AWS_18   # S3 access logging: opinionated extra, not baseline for this simple bucket module
  - CKV2_AWS_61  # S3 lifecycle configuration: opinionated extra, not baseline for this simple bucket module
  - CKV2_AWS_62  # S3 event notifications: opinionated extra, not baseline for this simple bucket module
  - CKV_AWS_144  # S3 cross-region replication: opinionated extra, not baseline for this simple bucket module
  - CKV_AWS_145  # S3 bucket KMS encryption: module defaults to SSE-S3 (AES256) for simplicity; sse_algorithm/kms_key_arn let callers opt into KMS
summary-position: bottom
output: cli
compact: true
quiet: true
