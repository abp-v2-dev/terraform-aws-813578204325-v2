name: Claude

# Thin caller — the AI review logic lives in central-repo and cannot be modified
# from this repo (see CLAUDE_INTEGRATION.md). This file is intentionally minimal
# and byte-identical across module repos so a bot can bump @v1 -> @v2 everywhere.
#
# A reusable workflow cannot declare issue_comment triggers itself, so the caller
# must. This file is protected by the prevent-workflow-edit org ruleset +
# CODEOWNERS (.github/** requires admin approval).
#
# Trigger: a PR comment containing /claude-review or @claude, from an
# OWNER/MEMBER/COLLABORATOR (enforced by the reusable workflow's auth gate).

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

# A reusable workflow can never receive more permission than its caller's
# GITHUB_TOKEN holds — the caller is the ceiling. This repo defaults to
# read-all, so without this block id-token/pull-requests would be `none` and
# the call to tf-module-ai-review.yml (which requests id-token: write +
# pull-requests: write) is rejected at parse time. These must be >= what the
# reusable workflow declares.
permissions:
  id-token: write       # OIDC -> Bedrock
  contents: read        # advisory only
  pull-requests: write  # post review comments
  actions: read         # Phase 2 CI triage — reusable workflow reads check/job logs

jobs:
  claude:
    # Only fire on PR comments that contain the trigger phrase. Handles both
    # event types: issue_comment carries github.event.issue.pull_request;
    # pull_request_review_comment (line-level) carries github.event.pull_request
    # and has no issue object.
    #
    # The `!contains('/claude-fix')` clause makes this ADVISORY (read) caller
    # mutually exclusive with the write-mode claude-fix.yml caller — a /claude-fix
    # comment must NOT also trigger a review. See CLAUDE_INTEGRATION.md §7.4.
    if: >
      github.event.comment.user.type != 'Bot' &&
      ( github.event.issue.pull_request || github.event_name == 'pull_request_review_comment' ) &&
      ( contains(github.event.comment.body, '/claude-review') ||
        contains(github.event.comment.body, '@claude') ) &&
      ! contains(github.event.comment.body, '/claude-fix')
    uses: abp-v2-dev/central-repo/.github/workflows/tf-module-ai-review.yml@v1
    secrets: inherit
